[project]
name = "spatial"
version = "0.1.0"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
manifest-path = "../../rust/spatial-py/Cargo.toml"
module-name = "spatial._core"
python-source = "src"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"
