[project]
name = "llms-spatial-intelligence"
version = "0.1.0"
requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.uv.workspace]
members = ["libs/python/spatial", "apps/solver"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
spatial = { workspace = true }

[tool.ruff]
extend-exclude = ["tests/data"]
line-length = 80
indent-width = 4

[tool.ruff.lint]
# Read more here: https://docs.astral.sh/ruff/rules/#flake8-async-async
select = [
    "E4", "E7", "E9", "F", "B", "I", "FAST001", "FAST002", "FAST003", "ASYNC100", "ASYNC105",
    "ASYNC109", "ASYNC110", "ASYNC115", "ASYNC116", "ASYNC210", "ASYNC220", "ASYNC221", "ASYNC222",
    "ASYNC230", "ASYNC251", "S101", "S102", "S103", "S104", "S105", "S106", "S107", "S108", "S110",
    "S112", "S113", "S201", "S202", "S301", "S302", "S303", "S304", "S305", "S306", "S307", "S308",
    "S310", "S312", "S313", "S314", "S315", "S316", "S317", "S318", "S319", "S321", "S323",
    "S324", "S501", "S502", "S503", "S504", "S505", "S506", "S507", "S508", "S509", "S601", "S602",
    "S603", "S604", "S605", "S606", "S607", "S608", "S609", "S610", "S611", "S612", "S701", "S702",
    "S704", "BLE001", "C4", "T10", "INT", "LOG", "G", "Q", "RSE", "SLF", "SIM", "RUF",
]
ignore = []

# Disable selected rules only for files in tests/
# Customize the list as needed (e.g. S101/S105/S106 are often relaxed in tests).
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101", "S105", "S106", "S107", "S108", "S608",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]

# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
disallow_incomplete_defs = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "apps/solver/src",
    "libs/python/spatial/src",
]
packages = ["solver", "spatial"]
exclude = [
    "^\\.venv/",
    "^target/",
]

[[tool.mypy.overrides]]
module = "spatial._core"
ignore_missing_imports = true
